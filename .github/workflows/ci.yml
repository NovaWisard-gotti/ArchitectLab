name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  quality:
    name: Analisis estatico y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Version de Flutter
        run: flutter --version

      - name: Dependencias
        run: flutter pub get

      - name: Analisis estatico
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pruebas unitarias
        run: flutter test --reporter expanded

  android:
    name: Compilar APK
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Generar carpeta android
        run: bash scripts/bootstrap_android.sh

      - name: Compilar APK de release
        run: flutter build apk --release

      - name: Renombrar artefacto
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/database-architect-lab-${GITHUB_SHA::7}.apk

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: database-architect-lab-apk
          path: dist/*.apk
          retention-days: 30

      - name: Crear release al etiquetar
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
